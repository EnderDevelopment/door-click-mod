plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.21.4'
        mappingsVersion = '1.21.4+build.1'
        run {
            version = 'client'
            propertyMap {
                'fabric-api' = '0.96.1+1.21.4'
            }
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.96.1+1.21.4'
}

processResources {
    inputs.property 'fabric.mod.json', project.file('src/main/resources/fabric.mod.json')
}
